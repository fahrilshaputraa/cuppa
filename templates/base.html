<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
<title>{% block title %}Cuppa{% endblock %} · {{ ctx.outlet }}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#a8481f">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/css/tokens.css?v={{ ctx.v }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ ctx.v }}">
<link rel="stylesheet" href="/static/css/shell.css?v={{ ctx.v }}">
{% if ctx.role.is_empty() %}<link rel="stylesheet" href="/custom.css?v={{ ctx.v }}">{% endif %}
<script src="/static/vendor/htmx.min.js?v={{ ctx.v }}" defer></script>
<script src="/static/vendor/htmx-sse.js?v={{ ctx.v }}" defer></script>
<script src="/static/js/app.js?v={{ ctx.v }}" defer></script>
</head>
<body class="theme-{{ ctx.theme }}" {% if !ctx.role.is_empty() %}data-idle="600"{% endif %}>
{% block shell %}{% endblock %}
<div class="site-foot">{% if ctx.role.is_empty() %}<a href="/lang/id">Indonesia</a> · <a href="/lang/en">English</a> · {% endif %}Cuppa · AGPL-3.0 · <a href="https://github.com/fahrilshaputraa/cuppa" rel="noopener">Kode sumber</a></div>
</body>
</html>
