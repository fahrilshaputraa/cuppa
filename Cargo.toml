[package]
name = "cuppa"
version = "0.1.0"
edition = "2024"
description = "Self-hosted POS and QR ordering for small cafes"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fahrilshaputraa/cuppa"
publish = false

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit", "compression-gzip", "fs", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
