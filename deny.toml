[advisories]
yanked = "warn"

[licenses]
# AGPL-3.0 compatible permissive licenses only.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "AGPL-3.0-or-later", "CDLA-Permissive-2.0", "OpenSSL"]

[bans]
