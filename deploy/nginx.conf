# Cuppa behind nginx with HTTPS (Let's Encrypt). Replace kafe.contoh.id, then: sudo nginx -t && sudo systemctl reload nginx
limit_req_zone $binary_remote_addr zone=pelanggan:10m rate=5r/s;   # put this line in the http {} block

server {
    listen 80;
    server_name kafe.contoh.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kafe.contoh.id;

    ssl_certificate     /etc/letsencrypt/live/kafe.contoh.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafe.contoh.id/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # customer pages/API: per-IP rate limit
    location /m/ {
        limit_req zone=pelanggan burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # realtime (SSE): never buffer
    location /events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
